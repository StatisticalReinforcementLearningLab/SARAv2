<ion-header>
  <ion-toolbar class="new-background-color">
    <ion-buttons slot="start">
      <ion-back-button style="color:#fff;" defaultHref="home"></ion-back-button>
    </ion-buttons>
    <ion-title style="color:#fff;">Life insight</ion-title>
  </ion-toolbar>
</ion-header>

  <ion-card id="visCard2">
    <div style="position: absolute;top:0px;left: 4px;z-index: 20;">
      <img src="/assets/img/happy_crab.png" style="width:75px;height:auto;">
    </div>
    <div class="item item-avatar" style="background: #ccecff;border-left: 3px solid #0091e6; padding: 3px; padding-left: 90px;">
      <div style="font-size: 16px; color: black;">How was your <b>level of motivation</b> this week?</div>
      <p style="font-size: 12px; color: black; padding-top: 5px;">0=low motivation, 4=high motivation</p>
    </div>
    <div id="vis4"></div>
    <div
      style="margin-left:0px; margin-right:0px;margin-top:0px; background:#e6f6ff; padding:0px; padding-left:15px; border-left: 0px solid #004D40; color:black; text-align:center; font-size: 14px;"
      ng-show="lifeinsight.showTopBottom" ng-bind-html="lifeinsight.top_message">
    </div>
  </ion-card>

  <ion-card id="visCard3">

      <p style="font-size: 12px; color: black;padding-top: 5px;">0=low positivity, 4=high positivity</p>
    </div>
    <div id="vis5"></div>

  <ion-card id="visCard4">
